<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공모전 예선 심사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface2: #F0EEE9;
    --border: rgba(0,0,0,0.08);
    --border-md: rgba(0,0,0,0.13);
    --text: #1A1917;
    --text-2: #6B6860;
    --text-3: #A8A49C;
    --accent: #1A1917;
    --grade-a-bg: #E8F5E3; --grade-a: #2D6A1F;
    --grade-b-bg: #E3EEF9; --grade-b: #1A4F87;
    --grade-c-bg: #FEF3E2; --grade-c: #854F0B;
    --grade-d-bg: #FDEAEA; --grade-d: #A32D2D;
    --success: #2D6A1F;
    --radius: 8px;
    --radius-lg: 12px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
  }

  /* ── 로그인 ── */
  #screen-login {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: var(--bg);
  }
  .login-wrap {
    width: 360px;
  }
  .login-logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text-2);
    text-transform: uppercase;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .login-logo::before {
    content: '';
    display: block;
    width: 20px; height: 20px;
    background: var(--text);
    border-radius: 4px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px;
  }
  .login-card h2 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .login-card p {
    font-size: 15px;
    color: var(--text-2);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  .field-input {
    width: 100%;
    padding: 10px 14px;
    font-size: 15px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: var(--text); }
  .login-err {
    font-size: 12px;
    color: var(--grade-d);
    margin-top: 8px;
    display: none;
  }
  .btn-login {
    width: 100%;
    margin-top: 16px;
    padding: 11px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-login:hover { opacity: 0.85; }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  .field-group { margin-top: 14px; }
  .demo-codes {
    margin-top: 20px;
    padding: 12px 14px;
    background: var(--surface2);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.8;
  }
  .demo-codes strong { color: var(--text); font-family: 'DM Mono', monospace; font-weight: 500; }

  /* ── 앱 레이아웃 ── */
  #screen-judge, #screen-admin {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  /* 탑바 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sheet-input {
    width: 280px;
    padding: 7px 12px;
    font-size: 14px;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.15s;
  }
  .sheet-input:focus { border-color: var(--text); }
  .btn {
    padding: 7px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    transition: background 0.12s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); }
  .btn.dark {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .btn.dark:hover { opacity: 0.85; background: var(--text); }
  .judge-name {
    font-size: 13px;
    color: var(--text-2);
    padding: 0 4px;
  }

  /* 메인 영역 */
  .main {
    display: grid;
    grid-template-columns: 210px 1fr;
    flex: 1;
    overflow: hidden;
  }

  /* 사이드바 */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-head {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-head-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
  }
  .sidebar-count {
    font-size: 11px;
    color: var(--text-3);
    font-family: 'DM Mono', monospace;
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-track { background: transparent; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }

  .entry-item {
    padding: 10px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s;
  }
  .entry-item:hover { background: var(--bg); }
  .entry-item.active {
    border-left-color: var(--text);
    background: var(--bg);
  }
  .entry-org { font-size: 14px; font-weight: 500; color: var(--text); }
  .entry-rep { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .entry-grades { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; }
  .grade-pip {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
  }
  .pip-A { background: var(--grade-a-bg); color: var(--grade-a); }
  .pip-B { background: var(--grade-b-bg); color: var(--grade-b); }
  .pip-C { background: var(--grade-c-bg); color: var(--grade-c); }
  .pip-D { background: var(--grade-d-bg); color: var(--grade-d); }
  .pip-none { background: var(--surface2); color: var(--text-3); border: 1px solid var(--border); }

  /* 오른쪽 패널 — 좌우 분할 */
  .right-panel {
    display: flex;
    flex-direction: row;
    overflow: hidden;
    background: var(--bg);
  }

  /* 플레이스홀더 */
  .placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-3);
  }
  .placeholder svg { opacity: 0.3; }
  .placeholder p { font-size: 13px; }

  /* 왼쪽: 제출 내용 (스크롤) */
  .panel-submission {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    border-right: 1px solid var(--border-md);
    background: var(--surface);
    min-width: 0;
  }
  .panel-submission::-webkit-scrollbar { width: 5px; }
  .panel-submission::-webkit-scrollbar-track { background: transparent; }
  .panel-submission::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 3px; }

  .submission-header {
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .submission-org { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
  .submission-meta {
    display: flex;
    gap: 16px;
    margin-top: 5px;
    font-size: 13px;
    color: var(--text-2);
  }
  .submission-meta a { color: var(--grade-b); text-decoration: none; }
  .submission-meta a:hover { text-decoration: underline; }

  .qa-block { margin-bottom: 16px; }
  .qa-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-2);
    margin-bottom: 6px;
  }
  .qa-text {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
    background: var(--bg);
    border-radius: var(--radius);
    padding: 12px 14px;
    border: 1px solid var(--border);
  }
  .proto-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--grade-b);
    padding: 7px 12px;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    text-decoration: none;
    background: var(--surface);
    transition: background 0.12s;
  }
  .proto-btn:hover { background: var(--bg); }

  /* 오른쪽: 평가 입력 (고정 너비, 독립 스크롤) */
  .panel-eval {
    width: 300px;
    min-width: 300px;
    overflow-y: auto;
    padding: 16px 18px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .panel-eval::-webkit-scrollbar { width: 4px; }
  .panel-eval::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }
  .eval-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .eval-top-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
  }
  .eval-top-right { display: flex; align-items: center; gap: 10px; }
  .save-ok {
    font-size: 12px;
    color: var(--success);
    display: none;
    align-items: center;
    gap: 4px;
  }
  .save-ok.visible { display: flex; }

  .eval-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 10px;
  }
  .eval-item {}
  .eval-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .eval-item-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .rubric-toggle {
    font-size: 13px;
    color: var(--text-3);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
    user-select: none;
    transition: color 0.12s;
    white-space: nowrap;
  }
  .rubric-toggle:hover { color: var(--text-2); }

  .grade-btns { display: flex; gap: 5px; margin-top: 6px; }
  .grade-btn {
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.1s;
  }
  .grade-btn:hover { background: var(--surface2); }
  .grade-btn.sel-A { background: var(--grade-a-bg); color: var(--grade-a); border-color: #A8D898; }
  .grade-btn.sel-B { background: var(--grade-b-bg); color: var(--grade-b); border-color: #9BBFE0; }
  .grade-btn.sel-C { background: var(--grade-c-bg); color: var(--grade-c); border-color: #F5C97A; }
  .grade-btn.sel-D { background: var(--grade-d-bg); color: var(--grade-d); border-color: #F0AAAA; }

  /* 루브릭 팝오버 */
  .rubric-box {
    display: none;
    margin-top: 8px;
    margin-bottom: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14px;
  }
  .rubric-box.open { display: block; }
  .rubric-row {
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 8px;
    margin-bottom: 10px;
    align-items: start;
    line-height: 1.6;
  }
  .rubric-row:last-child { margin-bottom: 0; }
  .rubric-g { font-weight: 700; font-family: 'DM Mono', monospace; font-size: 13px; padding-top: 2px; }
  .rubric-g.A { color: var(--grade-a); }
  .rubric-g.B { color: var(--grade-b); }
  .rubric-g.C { color: var(--grade-c); }
  .rubric-g.D { color: var(--grade-d); }
  .rubric-desc { color: var(--text-2); }

  /* 종합 의견 */
  .comment-row { display: flex; gap: 8px; align-items: flex-start; }
  .comment-input {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    border: 1px solid var(--border-md);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    height: 80px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.6;
  }
  .comment-input:focus { border-color: var(--text); }
  .comment-input::placeholder { color: var(--text-3); }

  /* ── 관리자 ── */
  .admin-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    background: var(--bg);
  }
  .admin-body::-webkit-scrollbar { width: 5px; }
  .admin-body::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 3px; }
  .admin-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-bottom: 12px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--text-2); margin-bottom: 4px; }
  .stat-val { font-size: 26px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; letter-spacing: -0.02em; }

  .judge-block { margin-bottom: 28px; }
  .judge-block-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .result-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-3);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .result-table td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: top;
  }
  .result-table tr:last-child td { border-bottom: none; }
  .result-table tr:hover td { background: var(--bg); }

  /* 심사위원별 진행 현황 테이블 */
  .progress-table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); margin-bottom: 28px; }
  .progress-table th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .progress-table td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text); }
  .progress-table tr:last-child td { border-bottom: none; }
  .progress-bar-wrap { width: 100px; height: 6px; background: var(--border-md); border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .progress-bar-fill { height: 100%; border-radius: 3px; }
  .pct-done { color: #2D6A1F; font-weight: 600; }
  .pct-mid  { color: #854F0B; font-weight: 600; }
  .pct-zero { color: var(--text-3); font-weight: 600; }

  /* 로딩 스피너 */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border-md);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  .loading-wrap {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 0;
    color: var(--text-2); font-size: 13px;
  }
  .loading-dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }
</style>
</head>
<body>

<!-- ── 로그인 ── -->
<div id="screen-login">
  <div class="login-wrap">
    <div class="login-logo">공모전 심사</div>
    <div class="login-card">
      <h2>심사 시스템 접속</h2>
      <p>배부된 심사위원 코드 또는<br>관리자 코드를 입력하세요.</p>
      <label class="field-label" for="code-input">접속 코드</label>
      <input class="field-input" id="code-input" type="text" placeholder="예: JUDGE01" autocomplete="off" />
      <div class="field-group">
        <label class="field-label" for="password-input">비밀번호</label>
        <input class="field-input" id="password-input" type="password" placeholder="비밀번호 입력" autocomplete="current-password" />
      </div>
      <div class="login-err" id="login-err">코드 또는 비밀번호가 올바르지 않습니다.</div>
      <button class="btn-login" id="btn-login" onclick="doLogin()">접속하기</button>
    </div>

  </div>
</div>

<!-- ── 심사위원 화면 ── -->
<div id="screen-judge">
  <div class="topbar">
    <span class="topbar-title">공모전 예선 심사</span>
    <div class="topbar-right">
      <span class="judge-name" id="judge-name"></span>
      <button class="btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="main">
    <!-- 사이드바 -->
    <div class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-head-label">제출작</span>
        <span class="sidebar-count" id="entry-count">0</span>
      </div>
      <div class="sidebar-list" id="entry-list"></div>
    </div>
    <!-- 오른쪽 -->
    <div class="right-panel" id="right-panel">
      <div class="placeholder" id="placeholder">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <p>좌측에서 제출작을 선택하세요</p>
      </div>
    </div>
  </div>
</div>

<!-- ── 관리자 화면 ── -->
<div id="screen-admin">
  <div class="topbar">
    <span class="topbar-title">관리자 대시보드</span>
    <div class="topbar-right">
      <input class="sheet-input" id="sheet-url" type="text" placeholder="Apps Script 웹앱 URL 입력" />
      <button class="btn" onclick="loadSheet()">불러오기</button>

function sk(j, e) { return 'js_eval_' + j + '_' + e; }
function getEv(j, e) {
  try { const v = localStorage.getItem(sk(j, e)); return v ? JSON.parse(v) : null; }
  catch { return null; }
}
function setEv(j, e, d) {
  try { localStorage.setItem(sk(j, e), JSON.stringify(d)); } catch(err) { console.error(err); }
}

// HTML 특수문자 이스케이프 (사용자 제출 데이터를 innerHTML에 넣을 때 사용)
function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 안전한 URL 반환 — http/https 외 값은 # 으로 대체
function safeUrl(url) {
  return /^https?:\/\//i.test(url) ? url : '#';
}

  });

// 로그인 — 코드 + 비밀번호를 Google Apps Script(구글 시트 기반)로 검증한 뒤,
// 검증에 성공하면 기존과 동일한 방식으로 로그인 프로세스를 이어간다.
async function doLogin() {
  const codeInputEl = document.getElementById('code-input');
  const pwInputEl = document.getElementById('password-input');
  const errEl = document.getElementById('login-err');
  const btnEl = document.getElementById('btn-login');

  const code = codeInputEl.value.trim().toUpperCase();
  const password = pwInputEl.value;

  if (!code || !password) {
    errEl.textContent = '접속 코드와 비밀번호를 모두 입력하세요.';
    errEl.style.display = 'block';
    return;
  }

  errEl.style.display = 'none';
  const originalBtnText = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.textContent = '확인 중...';

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', code, password })
    });
    if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
    const data = await res.json();

    if (!data.success) {
      errEl.textContent = data.message || '코드 또는 비밀번호가 올바르지 않습니다.';
      errEl.style.display = 'block';
      return;
    }

    // ── 여기서부터는 기존 로그인 프로세스와 동일 ──
    const judge = JUDGES[code];
    if (!judge) {
      errEl.textContent = '인증에는 성공했으나 등록되지 않은 코드입니다. 관리자에게 문의하세요.';
      errEl.style.display = 'block';
      return;
    }

    pwInputEl.value = '';
    currentJudge = judge;
    if (judge.id === 'admin') {
      showScreen('screen-admin');
      document.getElementById('sheet-url').value = SCRIPT_URL;
      loadSheetForAdmin(SCRIPT_URL);
    } else {
      document.getElementById('judge-name').textContent = judge.name + ' 심사위원';
      // 로그인 즉시 이전 데이터 초기화
      entries = [];
      currentEntry = null;
      document.getElementById('entry-list').innerHTML = '';
      document.getElementById('entry-count').textContent = '0';
      document.getElementById('right-panel').innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>데이터 불러오는 중<span class="loading-dots"></span></p></div>';
      showScreen('screen-judge');
      loadSheetFromUrl(SCRIPT_URL);
    }
  } catch (err) {
    console.error(err);
    errEl.textContent = '로그인 확인 중 오류가 발생했습니다: ' + err.message;
    errEl.style.display = 'block';
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = originalBtnText;
  }
}
document.getElementById('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogout() {
  currentJudge = null;
  currentEntry = null;
  openRubrics = {};
  entries = [];
  document.getElementById('code-input').value = '';
  document.getElementById('password-input').value = '';
  // localStorage의 평가 데이터 초기화 (다음 심사위원에게 노출 방지)
  Object.keys(localStorage).filter(k => k.startsWith('js_eval_')).forEach(k => localStorage.removeItem(k));
  showScreen('screen-login');
}

  entries.forEach(en => {
    const ev = getEv(currentJudge.id, en.id);

    const pips = CRITERIA.map(c => {
      const g = grades[c.id];
      return g ? `<span class="grade-pip pip-${g}">${g}</span>` : '';
    }).join('');
    const hasAny = Object.keys(grades).length > 0;
    const div = document.createElement('div');
    div.className = 'entry-item' + (currentEntry && currentEntry.id === en.id ? ' active' : '');
    div.innerHTML = `
      <div class="entry-org">${escapeHtml(en.rep)}</div>
      <div class="entry-rep">${en.orgIntro ? escapeHtml(en.orgIntro.slice(0, 26)) + (en.orgIntro.length > 26 ? '…' : '') : ''}</div>
      <div class="entry-grades">
        ${hasAny ? pips : '<span class="grade-pip pip-none">미평가</span>'}
      </div>`;
    div.onclick = () => selectEntry(en);
    list.appendChild(div);
  });
}

// 제출작 선택
function selectEntry(en) {
  currentEntry = en;
  openRubrics = {};
  renderSidebar();
  renderDetail(en);
}

function renderDetail(en) {
  const ev = getEv(currentJudge.id, en.id);
  const grades = ev && ev.grades ? ev.grades : {};

  // 총점 계산
  const totalScore = CRITERIA.reduce((sum, cr) => {
    const g = grades[cr.id];
    return sum + (g ? (SCORE_MAP[g] || 0) : 0);
  }, 0);
  const maxScore = CRITERIA.length * 20;

  const criteriaHTML = CRITERIA.map(cr => {
    const sel = grades[cr.id] || '';
    const btns = ['A', 'B', 'C'].map(g =>
      `<button class="grade-btn${sel === g ? ' sel-' + g : ''}" data-cid="${cr.id}" data-grade="${g}">${g}</button>`
    ).join('');
    const rubricRows = ['A', 'B', 'C'].map(g =>
      `<div class="rubric-row"><span class="rubric-g ${g}">${g}</span><span class="rubric-desc">${cr.rubric[g]}</span></div>`
    ).join('');
    return `
      <div class="eval-item">
        <div class="eval-item-top">
          <span class="eval-item-name">${cr.label}</span>
          <span class="rubric-toggle" onclick="toggleRubric('${cr.id}')">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 16v-4M12 8h.01"/></svg>
            기준 보기
          </span>
        </div>

        <div class="rubric-box${openRubrics[cr.id] ? ' open' : ''}" id="rubric-${cr.id}">${rubricRows}</div>
        <div class="grade-btns">${btns}</div>
      </div>`;
  }).join('');

  const panel = document.getElementById('right-panel');
  const eRep      = escapeHtml(en.rep);
  const eEmail    = escapeHtml(en.email);
  const eOrgIntro = escapeHtml(en.orgIntro);
  const eTeamIntro= escapeHtml(en.teamIntro);
  const eQ1       = escapeHtml(en.q1);
  const eQ2       = escapeHtml(en.q2);
  const eQ3       = escapeHtml(en.q3);
  const eQ4       = escapeHtml(en.q4);
  const eProtoDesc= escapeHtml(en.protoDesc);
  const eProtoRef = escapeHtml(en.protoRef);
  const eAiTools  = escapeHtml(en.aiTools);
  const protoHref = safeUrl(en.proto);
  const orgCheckHtml = en.orgCheck
    ? en.orgCheck.split(',').map(s => s.trim()).filter(Boolean).map(s => {
        const text = escapeHtml(s.endsWith('.') ? s : s + '.');
        return `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;"><span style="color:var(--grade-a);font-weight:600;flex-shrink:0;">✓</span><span>${text}</span></div>`;
      }).join('')
    : '—';

  panel.innerHTML = `
    <div class="panel-submission" id="panel-submission">
      <div class="submission-header">
        <div class="submission-org">${eRep}</div>
        <div class="submission-meta">
          <span>${eEmail}</span>
          ${en.proto ? `<a href="${protoHref}" target="_blank" rel="noopener" style="color:var(--grade-b);font-size:12px;text-decoration:none;cursor:pointer;">프로토타입 보기 ↗</a>` : ''}
        </div>
      </div>
      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:10px;">섹션 1. 팀 정보</div>
      <div class="qa-block">
        <div class="qa-label">재직 기관 소개</div>
        <div class="qa-text">${eOrgIntro || '—'}</div>
      </div>
      <div class="qa-block">
        <div class="qa-label">팀원 구성 소개</div>
        <div class="qa-text">${eTeamIntro || '—'}</div>
      </div>
      <div class="qa-block">
        <div class="qa-label">기관 해당 사항</div>
        <div class="qa-text">${orgCheckHtml}</div>
      </div>

      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin:20px 0 10px;">섹션 2. 문제의 중요성</div>
      <div class="qa-block">
        <div class="qa-label">해결하려는 문제와 중요성</div>
        <div class="qa-text">${eQ1 || '—'}</div>
      </div>
      <div class="qa-block">
        <div class="qa-label">문제 해결 시 변화</div>
        <div class="qa-text">${eQ2 || '—'}</div>
      </div>

      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin:20px 0 10px;">섹션 3. AI 솔루션의 필요성</div>
      <div class="qa-block">
        <div class="qa-label">AI로 해결하려는 이유</div>
        <div class="qa-text">${eQ3 || '—'}</div>
      </div>
      ${en.q4 ? `<div class="qa-block">
        <div class="qa-label">기존 시도 활동 (선택)</div>
        <div class="qa-text">${eQ4}</div>
      </div>` : ''}

      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin:20px 0 10px;">섹션 4. 프로토타입</div>
      ${en.proto ? `<div class="qa-block">
        <div class="qa-label">프로토타입 링크</div>
        <div class="qa-text"><a href="${protoHref}" target="_blank" rel="noopener" style="color:var(--grade-b);">열기 ↗</a></div>
      </div>` : ''}
      <div class="qa-block">
        <div class="qa-label">프로토타입 설명</div>
        <div class="qa-text">${eProtoDesc || '—'}</div>
      </div>
      ${en.aiTools ? `<div class="qa-block">
        <div class="qa-label">사용한 AI 도구·기술</div>
        <div class="qa-text">${eAiTools}</div>
      </div>` : ''}
      ${en.protoRef ? `<div class="qa-block">
        <div class="qa-label">유사 사례 리서치 (선택)</div>
        <div class="qa-text">${eProtoRef}</div>
      </div>` : ''}
    </div>

    <div class="panel-eval">
      <div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);">평가 입력</span>
          <span class="save-ok" id="save-ok">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            저장됨
          </span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12px;color:var(--text-2);">A 20 · B 10 · C 0점</span>
          <span style="font-size:14px;font-weight:600;color:var(--text);">총점 <span id="total-score">${totalScore}</span><span style="font-size:12px;font-weight:400;color:var(--text-3);">/${maxScore}</span></span>
        </div>
      </div>
      <div class="eval-grid">${criteriaHTML}</div>
      <div style="height:1px;background:var(--border);margin:14px 0;"></div>
      <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px;">
        심사위원 추천 여부 <span style="font-size:11px;font-weight:400;color:var(--text-3);">점수 없음</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="grade-btn${ev && ev.recommend === 'yes' ? ' sel-A' : ''}" id="rec-yes" onclick="setRecommend('yes')">✓ 추천</button>
        <button class="grade-btn${ev && ev.recommend === 'no' ? ' sel-D' : ''}" id="rec-no" onclick="setRecommend('no')">✗ 비추천</button>
      </div>
      <div class="comment-row">
        <textarea class="comment-input" id="eval-comment" placeholder="종합의견 (선택)">${ev && ev.comment ? ev.comment : ''}</textarea>
      </div>
      <div style="margin-top:12px;">
        <button class="btn dark" onclick="saveEval()" style="width:100%;padding:10px;font-size:14px;">저장</button>
      </div>
    </div>`;

  // 등급 버튼 이벤트 + 총점 업데이트
  panel.querySelectorAll('.grade-btn[data-cid]').forEach(btn => {
    btn.onclick = () => {
      panel.querySelectorAll(`.grade-btn[data-cid="${btn.dataset.cid}"]`).forEach(b => b.className = 'grade-btn');
      btn.className = 'grade-btn sel-' + btn.dataset.grade;
      updateTotalScore();
    };
  });
}

function setRecommend(val) {
  const yes = document.getElementById('rec-yes');
  const no = document.getElementById('rec-no');
  if (!yes || !no) return;
  yes.className = 'grade-btn' + (val === 'yes' ? ' sel-A' : '');
  no.className  = 'grade-btn' + (val === 'no'  ? ' sel-D' : '');
  yes.dataset.selected = val === 'yes' ? 'yes' : '';
  no.dataset.selected  = val === 'no'  ? 'no'  : '';
}

function updateTotalScore() {
  const total = document.getElementById('total-score');
  if (!total) return;
  let sum = 0;
  CRITERIA.forEach(cr => {
    const sel = document.querySelector(`.grade-btn[data-cid="${cr.id}"].sel-A, .grade-btn[data-cid="${cr.id}"].sel-B, .grade-btn[data-cid="${cr.id}"].sel-C`);
    if (sel) sum += (SCORE_MAP[sel.dataset.grade] || 0);
  });
  total.textContent = sum;
}

function toggleRubric(cid) {
  openRubrics[cid] = !openRubrics[cid];
  const el = document.getElementById('rubric-' + cid);
  if (el) el.classList.toggle('open', !!openRubrics[cid]);
}

function saveEval() {
  if (!currentEntry || !currentJudge) return;
  const grades = {};
  CRITERIA.forEach(cr => {
    const sel = document.querySelector(`.grade-btn[data-cid="${cr.id}"].sel-A, .grade-btn[data-cid="${cr.id}"].sel-B, .grade-btn[data-cid="${cr.id}"].sel-C`);
    if (sel) grades[cr.id] = sel.dataset.grade;
  });
  const comment = document.getElementById('eval-comment').value;
  const recYes = document.getElementById('rec-yes');
  const recommend = recYes && recYes.classList.contains('sel-A') ? 'yes'
                  : document.getElementById('rec-no') && document.getElementById('rec-no').classList.contains('sel-D') ? 'no' : '';
  const savedAt = new Date().toISOString();

  // 총점 계산
  const totalScore = CRITERIA.reduce((sum, cr) => sum + (grades[cr.id] ? (SCORE_MAP[grades[cr.id]] || 0) : 0), 0);

  // 1. 로컬 저장 (백업용)
  setEv(currentJudge.id, currentEntry.id, { grades, comment, recommend, totalScore, savedAt });

  // 2. Apps Script로 POST 전송 (중앙 저장)
  if (SCRIPT_URL) {
    const scriptUrl = SCRIPT_URL;
    const payload = {
      judgeCode: getJudgeCode(currentJudge.id),
      judgeName: currentJudge.name,
      email: currentEntry.email,
      rep: currentEntry.rep,
      grades, comment, recommend, totalScore, savedAt
    };
    fetch(scriptUrl, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).catch(err => console.warn('서버 저장 실패 (로컬에는 저장됨):', err));
  }

  const ok = document.getElementById('save-ok');
  ok.classList.add('visible');
  setTimeout(() => ok.classList.remove('visible'), 2000);
  renderSidebar();
}

// 관리자가 URL 입력 후 불러오기 클릭
function loadSheet() {
  const url = document.getElementById('sheet-url').value.trim();
  if (!url) { alert('Apps Script 웹앱 URL을 입력하세요.'); return; }
  loadSheetForAdmin(url);
}

// 관리자 전용: 전체 데이터 불러온 후 대시보드 갱신
let adminEvals = [];

function loadSheetForAdmin(url) {
  const adminBody = document.getElementById('admin-body');
  adminBody.innerHTML = '<div class="loading-wrap" style="height:200px;"><div class="spinner"></div><p>데이터 불러오는 중<span class="loading-dots"></span></p></div>';

  fetch(url)
    .then(res => { if (!res.ok) throw new Error('네트워크 오류: ' + res.status); return res.json(); })
    .then(data => {
      if (!data.success) {
        adminBody.innerHTML = '<div style="padding:40px;color:var(--grade-d);">오류: ' + (data.message || '불러오기 실패') + '</div>';
        const e = new Error(data.message || '불러오기 실패');
        e.handled = true;
        return Promise.reject(e);
      }
      entries = (data.rows || []).map(rowToEntry);
      return fetch(url + '&admin=1');
    })
    .then(res => res.json())
    .then(evalData => {
      adminEvals = evalData.evals || [];
      renderAdmin();
    })
    .catch(err => {
      if (!err.handled) adminBody.innerHTML = '<div style="padding:40px;color:var(--grade-d);">불러오기 실패: ' + err.message + '</div>';
    });
}

// 실제 데이터 fetch (심사위원 자동 로드 시에도 재사용)
function loadSheetFromUrl(url) {
  const rp = document.getElementById('right-panel');
  if (rp) rp.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>데이터 불러오는 중<span class="loading-dots"></span></p></div>';

  // 심사위원이면 judge 파라미터로 필터링, 관리자면 전체
  const judgeParam = (currentJudge && currentJudge.id !== 'admin')
    ? '&judge=' + encodeURIComponent(getJudgeCode(currentJudge.id))
    : '';

  fetch(url + judgeParam)
    .then(res => {
      if (!res.ok) throw new Error('네트워크 오류: ' + res.status);
      return res.json();
    })
    .then(data => {
      if (!data.success) {
        if (rp) rp.innerHTML = '<div class="placeholder"><p>오류: ' + (data.message || '데이터를 불러오지 못했습니다.') + '</p></div>';
        return;
      }

      entries = (data.rows || []).map(rowToEntry);

      // 구글 시트에서 불러온 이전 평가결과를 localStorage에 복원
      if (data.evals && data.evals.length > 0) {
        data.evals.forEach(ev => {
          const grades = {};
          if (ev.c1) grades['c1'] = ev.c1;
          if (ev.c2) grades['c2'] = ev.c2;
          if (ev.c3) grades['c3'] = ev.c3;
          if (ev.c4) grades['c4'] = ev.c4;
          if (ev.c5) grades['c5'] = ev.c5;
          const evalData = { grades, comment: ev.comment || '', recommend: ev.recommend || '', totalScore: ev.totalScore || 0, savedAt: ev.savedAt || '' };
          setEv(currentJudge.id, ev.entryId, evalData);
        });
      }

      if (entries.length === 0) {
        if (rp) rp.innerHTML = '<div class="placeholder"><p>담당 제출작이 없습니다.<br>시트의 담당심사위원1/2 열을 확인하세요.</p></div>';
        return;
      }

      renderSidebar();
      if (rp) rp.innerHTML = '<div class="placeholder"><svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" style="opacity:.3"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>' + entries.length + '개 제출작을 불러왔습니다. 좌측에서 선택하세요.</p></div>';
    })
    .catch(err => {
      console.error(err);
      if (rp) rp.innerHTML = '<div class="placeholder"><p style="color:var(--grade-d)">불러오기 실패: ' + err.message + '</p><p style="font-size:13px;color:var(--text-3);margin-top:6px;">Apps Script 배포 설정에서<br>"액세스 권한: 모든 사용자"로 되어 있는지 확인하세요.</p></div>';
    });
}

// 관리자
function renderAdmin() {
  const judgeList = Object.values(JUDGES).filter(j => j.id !== 'admin');
  let totalEvals = 0;
  const allRows = [];

  // 심사위원별 통계 계산
  const judgeStats = judgeList.map(j => {
    const judgeCode = getJudgeCode(j.id);
    const myEntries = entries.filter(en => {
      const a1 = NAME_TO_CODE[en.assignedJudge1] || en.assignedJudge1;
      const a2 = NAME_TO_CODE[en.assignedJudge2] || en.assignedJudge2;
      return a1 === judgeCode || a2 === judgeCode;
    });
    let done = 0;
    myEntries.forEach(en => {
      const ev = adminEvals.find(e => e.judgeCode === judgeCode && e.entryId === en.id)
              || getEv(j.id, en.id);
      if (ev && ev.grades && Object.keys(ev.grades).length > 0) {
        done++;
        totalEvals++;
        allRows.push({ judge: j.name, ...en, ...ev });
      }
    });
    return { judge: j, judgeCode, myEntries, done, total: myEntries.length, pct: myEntries.length ? Math.round(done / myEntries.length * 100) : 0 };
  });

  const totalAssigned = judgeList.reduce((s, j) => {
    const jc = getJudgeCode(j.id);
    return s + entries.filter(en => {
      const a1 = NAME_TO_CODE[en.assignedJudge1] || en.assignedJudge1;
      const a2 = NAME_TO_CODE[en.assignedJudge2] || en.assignedJudge2;
      return a1 === jc || a2 === jc;
    }).length;
  }, 0);
  const totalPct = totalAssigned > 0 ? Math.round(totalEvals / totalAssigned * 100) : 0;

  // 진행 현황 테이블 행
  const progressRows = judgeStats.map(s => {
    const pctClass = s.pct === 100 ? 'pct-done' : s.pct === 0 ? 'pct-zero' : 'pct-mid';
    const barColor = s.pct === 100 ? '#2D6A1F' : s.pct === 0 ? 'var(--border-md)' : '#854F0B';
    return `<tr>
      <td style="font-weight:500">${s.judge.name}</td>
      <td style="color:var(--text-2);font-family:'DM Mono',monospace">${s.total}</td>
      <td style="color:var(--text-2);font-family:'DM Mono',monospace">${s.done}</td>
      <td style="color:var(--text-2);font-family:'DM Mono',monospace">${s.total - s.done}</td>
      <td>
        <span class="progress-bar-wrap"><span class="progress-bar-fill" style="width:${s.pct}%;background:${barColor}"></span></span>
        <span class="${pctClass}">${s.pct}%</span>
      </td>
    </tr>`;
  }).join('');

  let html = `
    <div class="admin-section-title" style="margin-bottom:12px;">전체 현황</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">심사위원</div><div class="stat-val">${judgeList.length}</div></div>
      <div class="stat-card"><div class="stat-label">전체 제출작</div><div class="stat-val">${entries.length}</div></div>
      <div class="stat-card"><div class="stat-label">완료 평가</div><div class="stat-val">${totalEvals}</div></div>
      <div class="stat-card"><div class="stat-label">전체 진행률</div><div class="stat-val">${totalPct}%</div></div>
    </div>

    <div class="admin-section-title" style="margin-bottom:12px;">심사위원별 진행 현황</div>
    <table class="progress-table">
      <thead><tr>
        <th style="width:120px">심사위원</th>
        <th style="width:60px">담당</th>
        <th style="width:60px">완료</th>
        <th style="width:60px">미완료</th>
        <th>진행률</th>
      </tr></thead>
      <tbody>${progressRows}</tbody>
    </table>`;

  judgeStats.forEach(s => {
    let rows = '';
    s.myEntries.forEach(en => {
      const jc2 = getJudgeCode(s.judge.id);
      const ev = adminEvals.find(e => e.judgeCode === jc2 && e.entryId === en.id)
              || getEv(s.judge.id, en.id);
      const gs = ev && ev.grades ? ev.grades : {};
      const gradeCells = CRITERIA.map(c => {
        const g = gs[c.id];
        return `<td>${g ? `<span class="grade-pip pip-${g}">${g}</span>` : '—'}</td>`;
      }).join('');
      const recText = ev && ev.recommend === 'yes' ? '<span style="color:var(--grade-a);font-weight:500">추천</span>'
                    : ev && ev.recommend === 'no'  ? '<span style="color:var(--grade-d);font-weight:500">비추천</span>' : '—';
      rows += `<tr>
        <td>${en.rep}</td>
        <td style="color:var(--text-2)">${en.email}</td>
        ${gradeCells}
        <td style="font-family:'DM Mono',monospace;font-weight:600">${ev && ev.totalScore != null ? ev.totalScore : '—'}</td>
        <td>${recText}</td>
        <td style="color:var(--text-2);font-size:11px">${ev && ev.comment ? ev.comment.slice(0, 40) + (ev.comment.length > 40 ? '…' : '') : ''}</td>
      </tr>`;
    });
    const pctClass = s.pct === 100 ? 'pct-done' : s.pct === 0 ? 'pct-zero' : 'pct-mid';
    html += `
      <div class="judge-block">
        <div class="judge-block-title">
          ${s.judge.name} 심사위원
          <span style="font-size:13px;font-weight:400;color:var(--text-2);margin-left:8px;">
            <span class="${pctClass}">${s.done} / ${s.total}</span> 완료
          </span>
        </div>
        <table class="result-table">
          <thead><tr>
            <th style="width:120px">팀대표</th>
            <th style="width:160px">이메일</th>
            ${CRITERIA.map(c => `<th style="width:70px">${c.label.slice(0, 5)}</th>`).join('')}
            <th style="width:60px">총점</th>
            <th style="width:60px">추천</th>
            <th>이유</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  });

  window._adminRows = allRows;
  document.getElementById('admin-body').innerHTML = html;
}

function downloadCSV() {
  renderAdmin();
  const rows = window._adminRows || [];
  if (!rows.length) { alert('저장된 평가 데이터가 없습니다.'); return; }
  const header = ['심사위원', '기관소개', '팀대표', '이메일', ...CRITERIA.map(c => c.label), '종합의견', '저장시간'];
  const data = rows.map(r => [
    r.judge, '"' + (r.orgIntro || '').replace(/"/g, '""') + '"', r.rep, r.email,
    ...CRITERIA.map(c => r.grades && r.grades[c.id] ? r.grades[c.id] : '-'),
    '"' + (r.comment || '').replace(/"/g, '""') + '"',
    r.savedAt
  ]);
  const csv = [header, ...data].map(r => r.join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '예선심사결과.csv'; a.click();
}

showScreen('screen-login');
</script>
</body>
</html>
